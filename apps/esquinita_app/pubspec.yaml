name: esquinita_app
description: La Esquinita Orgánika — POS e inventario (Android + Windows).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Spanish date picker, dialogs and tooltips (part of the Flutter SDK).
  flutter_localizations:
    sdk: flutter
  esquinita_core:
    path: ../../packages/esquinita_core
  mobile_scanner: ^7.5.0
  win32: ^6.4.0
  ffi: ^2.2.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  http: ^1.6.0
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo-ticket.png
    - assets/branding/logo-mark.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
