name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Pub workspace: one resolution for app, server and core.
      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Core
        working-directory: packages/esquinita_core
        run: |
          dart analyze --fatal-infos
          dart test

      - name: Server
        working-directory: apps/server
        run: |
          dart analyze --fatal-infos
          dart test

      - name: App
        working-directory: apps/esquinita_app
        run: |
          flutter analyze --fatal-infos
          flutter test

  apk:
    name: Build APK (main only)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Debug build: release signing is not configured yet.
      - name: Build
        working-directory: apps/esquinita_app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: esquinita-app-debug-apk
          path: apps/esquinita_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
